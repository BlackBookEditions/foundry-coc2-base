    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Les Jets et les Messages</h2>

          <p class="alinea">
            Le fonctionnement des fenêtres de jet et des messages de chat (options, visibilité, jets en opposition…) est celui du système <strong>co2</strong> et n'est pas repris ici.
            Cette page couvre uniquement les formules et les malus propres à COC2.
          </p>

          <h3>Formules de combat</h3>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="2">Formules COC2</td>
              </tr>
              <tr class="tableau-entete">
                <td>Valeur</td>
                <td>Formule</td>
              </tr>
              <tr>
                <td>Initiative</td>
                <td>10 + INT + PER</td>
              </tr>
              <tr>
                <td>Défense</td>
                <td>10 + AGI + PER (l'armure n'y contribue plus, elle apporte de la RD — voir « Les Objets »)</td>
              </tr>
              <tr>
                <td>Attaque au contact (ATC)</td>
                <td>FOR, sans bonus de niveau</td>
              </tr>
              <tr>
                <td>Attaque à distance (ATD)</td>
                <td>AGI, sans bonus de niveau</td>
              </tr>
            </tbody>
          </table>

          <h3>États préjudiciables</h3>
          <p class="alinea">
            Affaibli (dé de malus), Étourdi, Invalide et Paralysé — sans équivalent dans le livre de règles COC2 — sont retirés de la liste des états. En contrepartie, trois états
            propres à COC2 sont ajoutés, et les malus des états conservés sont réécrits aux valeurs du livre de règles :
          </p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="3">Malus d'état COC2</td>
              </tr>
              <tr class="tableau-entete">
                <td>État</td>
                <td>Malus automatique</td>
                <td>Malus proposé en fenêtre de jet</td>
              </tr>
              <tr>
                <td>Ralenti</td>
                <td>-5 Init., -5 DEF (+5 m de déplacement)</td>
                <td>-5 aux attaques au contact et à distance</td>
              </tr>
              <tr>
                <td>Essoufflé</td>
                <td>-2 Init., -2 DEF (+5 m de déplacement)</td>
                <td>—</td>
              </tr>
              <tr>
                <td>Aveuglé</td>
                <td>-5 DEF</td>
                <td>-10 aux actions basées sur la vue (réduit à -5 si un test de Perception est réussi)</td>
              </tr>
              <tr>
                <td>Asphyxié</td>
                <td>-5 Init., -5 DEF</td>
                <td>-5 à toutes les actions ; 1d4 DM par tour tant que l'état dure (à appliquer manuellement)</td>
              </tr>
              <tr>
                <td>Fatigué</td>
                <td>—</td>
                <td>-2 à tous les tests tant que dure l'état</td>
              </tr>
              <tr>
                <td>Épuisé</td>
                <td>—</td>
                <td>-5 à tous les tests ; test de VOL difficulté 15 à chaque contrariété, sous peine d'agressivité verbale ou de larmes incontrôlées</td>
              </tr>
            </tbody>
          </table>
          <p class="alinea">
            Les malus « à toutes les actions » ou « aux actions basées sur la vue » ne peuvent pas être posés automatiquement par le moteur : ils sont proposés comme case à cocher dans
            la fenêtre de jet, au joueur ou au MJ de juger si l'action concernée est bien de ce type.
          </p>
        </div>
