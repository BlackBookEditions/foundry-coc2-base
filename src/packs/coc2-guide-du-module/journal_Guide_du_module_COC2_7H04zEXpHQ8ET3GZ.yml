      content: |-
        <div class="journal-page-coc-base">
          <h2>Autres fonctionnalités</h2>

          <h3>Notes de version intégrées</h3>
          <p class="alinea">
            Une fenêtre dédiée affiche les nouveautés du module, alimentée par un historique embarqué. Elle s'ouvre automatiquement au MJ après une mise à jour, tant que de nouvelles
            entrées n'ont pas été marquées comme lues via la case « Ne plus afficher les notes de ces versions ». Elle reste consultable à tout moment via le bouton « Notes de version »
            du menu latéral Chroniques Oubliées.
          </p>

          <h3>Thème visuel</h3>
          <p class="alinea">
            Les fiches de personnage et de rencontre reprennent une palette de couleurs monochrome, distincte de la palette par défaut du système <strong>co2</strong>, pour un rendu plus
            sobre adapté à un cadre contemporain.
          </p>

          <h3>Mini-fiche (Vue actions)</h3>
          <p class="alinea">
            La mini-fiche utilisée par la Vue actions est adaptée : les Points de Vigueur et de Mana de COF2 sont retirés au profit des rubans Santé et Échelle d'évolution (cliquables,
            comme sur la fiche complète), et les valeurs de BDM et de CG sont ajoutées dans la barre latérale.
          </p>
        </div>
