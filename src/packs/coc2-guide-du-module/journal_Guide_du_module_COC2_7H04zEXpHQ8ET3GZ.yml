    type: text
    _id: 6iOtbHV23vUvHFoz
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Introduction</h2>

          <p class="lettrine">
            Chroniques Oubliées Contemporain 2ᵉ édition (COC2) est un module pour le système <strong>Chroniques Oubliées Contemporain 2ᵉ édition (COC2)</strong> : il n'installe pas un jeu de règles autonome, il adapte les mécaniques
            fantasy de Chroniques Oubliées 2ᵉ édition à un cadre contemporain. Concrètement, ce module change des formules de calcul, retire ou ajoute des notions de règles, et fournit
            quelques compendiums — mais il s'appuie du début à la fin sur le moteur du système <strong>Chroniques Oubliées 2ᵉ édition (CO2)</strong> (fenêtres de jet, Actions et Effets, résolveurs, etc.), qui n'est pas
            documenté ici.
          </p>

          <p class="alinea">
            Ce guide ne couvre donc que ce qui est <strong>spécifique à COC2</strong>. Pour tout ce qui concerne le fonctionnement générique du système (comment fonctionne une Action, un
            Effet, un jet d'attaque, un jet de sauvegarde…), reportez-vous à la documentation du système <strong>Chroniques Oubliées 2ᵉ édition (CO2)</strong> ou au Guide du système fourni par le module cof2-base — les
            mécaniques y sont identiques, seuls les habillages fantasy diffèrent.
          </p>

          <div class="encart">
            <h3>Sommaire du guide</h3>
            <ul>
              <li class="sans-puce"><strong>Les Acteurs</strong> — Échelle de santé, tranches d'âge et création, progression sans niveaux, BDM/CG, Échelle d'évolution, fiches Rencontre et Groupe de joueurs.</li>
              <li class="sans-puce"><strong>Les Objets</strong> — Traits distinctifs, Réduction de Dégâts et encombrement des protections, Bonus Critique, devise dollar, entraînements martiaux contemporains.</li>
              <li class="sans-puce"><strong>Actions et Effets</strong> — Application du Bonus Critique, minimum de dégâts garanti, absence des éléments de magie.</li>
              <li class="sans-puce"><strong>Les Jets et les Messages</strong> — Formules d'Initiative, de Défense et d'attaque propres à COC2, états préjudiciables spécifiques.</li>
              <li class="sans-puce"><strong>Autres fonctionnalités</strong> — Notes de version intégrées, thème visuel, mini-fiche adaptée.</li>
            </ul>
          </div>

          <h3>Compendium fourni</h3>
          <p class="alinea">
            Le module fournit un unique compendium d'objets, <strong>COC2 Objets</strong> : voies, capacités et équipements adaptés à COC2, <strong>sans texte descriptif</strong> — seules
            certaines mécaniques (modificateurs, actions, résolveurs) sont incluses. Le contenu narratif reste la propriété du livre de règles imprimé. Pour les capacités, seules quelques unes sont entièrement configurées.
          </p>

          <h3>Réglages de monde</h3>
          <p class="alinea">Trois réglages contrôlent des options optionnelles ou d'ambiance, accessibles au MJ dans la Configuration du monde :</p>
          <table class="tableau">
            <tbody>
              <tr class="tableau-titre">
                <td colspan="2">Réglages du module</td>
              </tr>
              <tr class="tableau-entete">
                <td>Réglage</td>
                <td>Effet</td>
              </tr>
              <tr>
                <td>Activer l'Échelle d'évolution</td>
                <td>Affiche l'Échelle d'évolution sur les fiches et active ses modificateurs contextuels sur les tests (détails page « Les Acteurs »).</td>
              </tr>
              <tr>
                <td>Configurer l'échelle</td>
                <td>Menu dédié pour choisir, par palier de l'Échelle d'évolution, la caractéristique et la valeur du bonus et du malus associés.</td>
              </tr>
              <tr>
                <td>Échelles de santé Pulp</td>
                <td>Ambiance « action décomplexée » : raccourcit l'échelle de santé des adversaires mineurs et allonge celle du Premier rôle (détails page « Les Acteurs »).</td>
              </tr>
            </tbody>
          </table>

          <h3>Notes de version</h3>
          <p class="alinea">
            Un bouton « Notes de version », dans le menu latéral Chroniques Oubliées, ouvre l'historique des nouveautés du module. Cette fenêtre s'ouvre aussi automatiquement au MJ après
            une mise à jour, tant que les nouvelles entrées n'ont pas été marquées comme lues.
          </p>

          <div class="indications-mj">
            Ce module peut lui-même servir de socle à un module d'univers plus spécifique (ex. horreur cthulhienne), qui peut surcharger ses libellés, ses états et ses barèmes via
            <code>CONFIG.COC2BASE</code>. Cette API est documentée dans le <code>README.md</code> du dépôt, à destination des développeurs de modules, et n'est pas reprise ici.
          </div>
        </div>
