  - sort: 400000
    name: Actions et Effets
    type: text
    _id: l9nCx6yP94pq9Ci6
    system: {}
    title:
      show: false
      level: 1
    image: {}
    text:
      format: 1
      content: |-
        <div class="journal-page-coc-base">
          <h2>Actions et Effets</h2>

          <p class="alinea">
            Le moteur générique des Actions et Effets (conditions, modificateurs, résolveurs) est celui du système <strong>co2</strong> et n'est pas repris ici. Cette page ne couvre que
            les comportements que COC2 modifie par rapport à COF2.
          </p>

          <h3>Application du Bonus Critique</h3>
          <p class="alinea">
            Sur une réussite critique d'une attaque, COC2 ajoute automatiquement le Bonus Critique (BC) de l'arme ou de l'attaque au jet de dommages déjà évalué, au lieu du doublement des
            dommages appliqué par COF2. Ce comportement est transparent pour l'utilisateur : le jet de dommages affiché dans le message de chat inclut déjà le BC, sur toutes les cartes
            (jet combiné, jet différé, jet en opposition, relance après un point de chance).
          </p>

          <h3>Minimum de dégâts</h3>
          <p class="alinea">
            Une attaque qui touche inflige toujours <strong>au moins 1 point de dégât</strong>, même si la formule tombe à zéro ou en négatif après application des malus de
            caractéristiques — avant application de la Réduction de Dégâts de la cible.
          </p>

          <h3>Absence des éléments de magie</h3>
          <p class="alinea">
            Attaque magique, Points de Magie, Défense magique et catégorie martiale — notions de COF2 sans équivalent dans le livre de règles COC2 — sont <strong>retirés</strong> des
            fiches d'objet et de personnage, pas seulement masqués visuellement. Une valeur éventuellement déjà stockée sur un objet migré depuis COF2 reste conservée en base, mais n'est
            plus éditable ni utilisée par aucun calcul.
          </p>
        </div>
